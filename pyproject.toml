[project]
name = "portafolio"
version = "0.1.0"
description = "Generador del sitio estático del portafolio"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.1"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# El renderizador emite HTML: partir una línea de plantilla en dos la vuelve ilegible y añade
# un punto donde meter un espacio de más en la salida.
"sitio/render.py" = ["E501"]
