# Integración continua: valida el generador en cada cambio. No construye el sitio publicable
# ni necesita los informes reales — para eso están las fixtures, que son informes capturados.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Tests y formato (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar las dependencias de desarrollo
        run: python -m pip install --quiet pytest ruff==0.16.1
      - name: Verificar el formato
        run: ruff format --check .
      - name: Analizar el código
        run: ruff check .
      - name: Ejecutar los tests
        run: python -m pytest tests/ -q
