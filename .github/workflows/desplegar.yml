# Construye el sitio y lo publica en GitHub Pages sobre vigiabref.com.
#
# **Se dispara por tres caminos, y el que importa es el segundo.** El sitio no tiene contenido
# propio que cambie a diario: lo que cambia es el informe, y ese vive en otro repositorio. Sin
# el `repository_dispatch`, la portada seguiría publicando las cifras del día en que alguien
# tocó este repositorio por última vez — envejeciendo en silencio, que es el modo de fallo que
# todo el diseño de este sitio existe para evitar.
name: Desplegar el sitio

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    # Lo emite `daily.yml` de `threat-intel-pipeline` cuando publica un informe nuevo.
    types: [informe-publicado]

permissions: {}

# Dos despliegues simultáneos publicarían en orden indeterminado. No se cancela el que corre:
# la segunda invocación reconstruye desde cero, de modo que esperar no pierde nada.
concurrency:
  group: paginas
  cancel-in-progress: false

jobs:
  construir:
    name: Construir el sitio
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar el sitio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Descargar los informes del pipeline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Shatior/threat-intel-pipeline
          path: pipeline
          # **Sin `token:` a propósito.** El pipeline es público, de modo que se lee sin
          # credencial: `GITHUB_TOKEN` no alcanza a otro repositorio, pero para uno público no
          # hace falta que alcance. Si volviera a hacerse privado, aquí haría falta otra vez un
          # token de lectura de contenido sobre él, en los secretos de este repositorio.
          # Solo se necesitan los ficheros de la última versión, no el historial.
          fetch-depth: 1
          sparse-checkout: reports

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Ejecutar los tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      - name: Construir
        # Falla con código distinto de cero si no hay informes, y entonces **no se despliega**.
        # Publicar el sitio con las cifras en blanco sería indistinguible de publicarlo al día.
        #
        # **`--base` es provisional.** Mientras `vigiabref.com` no resuelva, Pages sirve el sitio
        # bajo `/portafolio/`, y sin prefijo todas las rutas internas pedirían sus ficheros a la
        # raíz de `shatior.github.io`. El día que el dominio funcione se retira esta línea y el
        # sitio vuelve a construirse desde la raíz, sin más cambios.
        run: |
          python construir.py \
            --informes pipeline/reports \
            --salida publico \
            --base https://shatior.github.io/portafolio

      - name: Preparar el artefacto de Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: publico

  desplegar:
    name: Publicar en Pages
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
