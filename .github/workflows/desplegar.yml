# Construye el sitio y lo publica en GitHub Pages.
#
# **Se dispara por tres caminos, y el que importa es el segundo.** El sitio no tiene contenido
# propio que cambie a diario: lo que cambia es el informe, y ese vive en otro repositorio. Sin
# el `repository_dispatch`, la portada seguiría publicando las cifras del día en que alguien
# tocó este repositorio por última vez — envejeciendo en silencio, que es el modo de fallo que
# todo el diseño de este sitio existe para evitar.
name: Desplegar el sitio

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    # Lo emite `daily.yml` de `threat-intel-pipeline` cuando publica un informe nuevo.
    types: [informe-publicado]

permissions: {}

# Dos despliegues simultáneos publicarían en orden indeterminado. No se cancela el que corre:
# la segunda invocación reconstruye desde cero, de modo que esperar no pierde nada.
concurrency:
  group: paginas
  cancel-in-progress: false

jobs:
  construir:
    name: Construir el sitio
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar el sitio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Descargar los informes del pipeline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Shatior/threat-intel-pipeline
          path: pipeline
          # **Con `token:` porque el pipeline volvió a ser privado.** `GITHUB_TOKEN` está
          # acotado a este repositorio y no alcanza al otro, así que hace falta un PAT
          # fine-grained con Contents: read sobre `threat-intel-pipeline`, guardado aquí
          # como `TOKEN_LECTURA_PIPELINE`.
          #
          # Ese token **caduca**. El día que lo haga, este paso falla y el sitio deja de
          # reconstruirse: el fallo es ruidoso a propósito, porque la alternativa —seguir
          # publicando las cifras del último día que funcionó— es el modo de fallo que
          # todo este diseño existe para evitar.
          #
          # Si el pipeline vuelve a ser público, esta línea puede retirarse: un
          # repositorio público se lee sin credencial.
          token: ${{ secrets.TOKEN_LECTURA_PIPELINE }}
          # Solo se necesitan los ficheros de la última versión, no el historial.
          fetch-depth: 1
          sparse-checkout: reports

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Ejecutar los tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      - name: Construir
        # Falla con código distinto de cero si no hay informes, y entonces **no se despliega**.
        # Publicar el sitio con las cifras en blanco sería indistinguible de publicarlo al día.
        #
        # **`--base` es obligatorio y aquí está la única copia de la URL de publicación.** El
        # sitio no tiene dominio propio: se sirve bajo `/portafolio/`, y sin prefijo todas las
        # rutas internas pedirían sus ficheros a la raíz de `shatior.github.io`.
        #
        # El día que se compre un dominio, esta línea pasa a `--base https://elnuevodominio.com`
        # —sin prefijo, porque el sitio vivirá en una raíz— y hay que reponer el `CNAME` en
        # `construir.py`, donde está escrito el procedimiento completo.
        run: |
          python construir.py \
            --informes pipeline/reports \
            --salida publico \
            --base https://shatior.github.io/portafolio

      - name: Preparar el artefacto de Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: publico

      - name: Declarar que hoy no se publica
        # Un sitio que no se publica y no lo dice es indistinguible de uno publicado.
        # Si el despliegue está apagado, que quede escrito en el propio job.
        if: vars.PAGES_ACTIVO != 'true'
        run: |
          echo "::notice::Sitio construido y verificado, pero NO publicado: la variable" \
               "PAGES_ACTIVO no vale 'true'. Con el repositorio en privado y plan Free," \
               "GitHub Pages no está disponible. Al volver a público: reactiva Pages y pon" \
               "PAGES_ACTIVO=true en Settings > Secrets and variables > Actions > Variables."

  desplegar:
    name: Publicar en Pages
    needs: construir
    # **Interruptor de publicación.** GitHub Pages no existe en un repositorio privado
    # con plan Free: sin esta condición, el job fallaría en cada ejecución diaria y
    # entrenaría al mantenedor a ignorar el rojo. Con ella, el ciclo diario sigue
    # haciendo lo que importa —traer el informe, pasar los tests, construir el sitio y
    # guardar el artefacto— y solo se salta el último paso.
    #
    # Para reactivarlo: Settings > Secrets and variables > Actions > Variables,
    # `PAGES_ACTIVO` = `true`, con Pages ya habilitado en el repositorio.
    if: vars.PAGES_ACTIVO == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
